name: build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build core binaries
        run: make build-all

      - name: Upload ARM64 binary (RPi)
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw-linux-arm64
          path: build/picoclaw-linux-arm64
          if-no-files-found: error

      - name: Upload all builds
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw-all-platforms
          path: build/picoclaw-*
          if-no-files-found: error
